[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-radar"
version = "0.1.0"
description = "A time-aware LightGBM fraud-scoring model with isotonic calibration, built on the real IEEE-CIS Fraud Detection dataset."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "lightgbm>=4.0",
    "scikit-learn>=1.3",
    "pyarrow>=14.0",
    "tqdm>=4.66",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
fraud-radar = "fraud_radar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
